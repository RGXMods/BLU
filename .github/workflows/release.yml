name: Package and Release

on:
  push:
    tags:
      - 'v*'
      - '*'
    branches:
      - alpha
      - main
      - master

env:
  CF_API_KEY: ${{ secrets.CF_API_KEY }}
  WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
  WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
  GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --global user.name "donniedice"
          git config --global user.email "60427166+donniedice@users.noreply.github.com"

      - name: Determine Release Type
        id: set_release_type
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            if [[ "$TAG_NAME" == *"beta"* ]]; then
              echo "release_type=beta" >> $GITHUB_OUTPUT
            elif [[ "$TAG_NAME" == *"alpha"* ]]; then
              echo "release_type=alpha" >> $GITHUB_OUTPUT
            else
              echo "release_type=release" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/alpha" ]]; then
            echo "release_type=alpha" >> $GITHUB_OUTPUT
          else
            echo "release_type=none" >> $GITHUB_OUTPUT
          fi
          echo "tag_name=${{ github.ref_name }}" >> $GITHUB_OUTPUT

      - name: Extract Version from TOC
        id: extract_version
        run: |
          if [ -f "BLU.toc" ]; then
            version=$(grep -oP '^## Version: \K(.*)' BLU.toc || echo "unknown")
          else
            version="${{ github.ref_name }}"
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> $GITHUB_OUTPUT

      - name: Extract Changelog
        id: extract_changelog
        run: |
          if [ -f "docs/CHANGES.md" ]; then
            CHANGELOG=$(cat docs/CHANGES.md | head -50 | sed 's/\\/\\\\/g' | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
            echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT
          else
            echo "changelog=Check the commit history for changes" >> $GITHUB_OUTPUT
          fi

      - name: Package Addon
        uses: BigWigsMods/packager@master
        if: steps.set_release_type.outputs.release_type != 'none'

      - name: Send Discord Release Notification
        if: success() && steps.set_release_type.outputs.release_type == 'release'
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            const payload = {
              "username": "BLU Update",
              "avatar_url": "https://raw.githubusercontent.com/DonnieDice/BLU/main/images/logo.png",
              "embeds": [{
                "title": "🎉 BLU | Better Level-Up! - ${{ steps.extract_version.outputs.version }}",
                "description": "**Play sounds from other games!** A new version of BLU has been released!\\n\\n🎵 **What's New:**\\n${{ steps.extract_changelog.outputs.changelog }}",
                "url": "https://github.com/DonnieDice/BLU/releases/tag/${{ steps.set_release_type.outputs.tag_name }}",
                "color": 9830721,
                "thumbnail": {
                  "url": "https://raw.githubusercontent.com/DonnieDice/BLU/main/images/logo.png"
                },
                "fields": [
                  {
                    "name": "📥 Downloads",
                    "value": "[CurseForge](https://www.curseforge.com/wow/addons/blu)\\n[Wago.io](https://addons.wago.io/addons/vEGPgWK1)\\n[GitHub](https://github.com/DonnieDice/BLU)",
                    "inline": true
                  },
                  {
                    "name": "🎮 Compatibility",
                    "value": "✅ The War Within\\n✅ Dragonflight\\n✅ Classic Era\\n✅ Cataclysm",
                    "inline": true
                  },
                  {
                    "name": "💬 Support",
                    "value": "[Report Issues](https://github.com/DonnieDice/BLU/issues)\\n[Buy Me Coffee](https://www.buymeacoffee.com/donniedice)",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "RGX Mods - RealmGX Community",
                  "icon_url": "https://raw.githubusercontent.com/donniedice/SimpleQuestPlates/main/images/kiwi.gif"
                },
                "timestamp": "${{ steps.extract_version.outputs.timestamp }}"
              }]
            };
            
            const webhookUrl = new URL('${{ secrets.DISCORD_WEBHOOK }}');
            const options = {
              hostname: webhookUrl.hostname,
              path: webhookUrl.pathname + webhookUrl.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            };
            
            https.request(options, (res) => {
              console.log(`statusCode: ${res.statusCode}`);
            }).on('error', (error) => {
              console.error('Discord notification failed:', error);
            }).end(JSON.stringify(payload));

      - name: Send Discord Beta Notification
        if: success() && steps.set_release_type.outputs.release_type == 'beta'
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            const payload = {
              "username": "BLU Beta",
              "avatar_url": "https://raw.githubusercontent.com/DonnieDice/BLU/main/images/logo.png",
              "embeds": [{
                "title": "🧪 BLU Beta - ${{ steps.extract_version.outputs.version }}",
                "description": "A beta version of Better Level-Up! is available for testing!\\n\\n**What's New:**\\n${{ steps.extract_changelog.outputs.changelog }}",
                "color": 16744448,
                "fields": [
                  {
                    "name": "📥 Download Beta",
                    "value": "[CurseForge](https://www.curseforge.com/wow/addons/blu)\\n[GitHub](https://github.com/DonnieDice/BLU/releases)"
                  }
                ],
                "footer": {
                  "text": "RGX Mods - Beta Build",
                  "icon_url": "https://raw.githubusercontent.com/donniedice/SimpleQuestPlates/main/images/kiwi.gif"
                },
                "timestamp": "${{ steps.extract_version.outputs.timestamp }}"
              }]
            };
            
            const webhookUrl = new URL('${{ secrets.DISCORD_WEBHOOK }}');
            const options = {
              hostname: webhookUrl.hostname,
              path: webhookUrl.pathname + webhookUrl.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            };
            
            https.request(options, (res) => {
              console.log(`statusCode: ${res.statusCode}`);
            }).on('error', (error) => {
              console.error('Discord notification failed:', error);
            }).end(JSON.stringify(payload));

      - name: Send Discord Alpha Notification
        if: success() && steps.set_release_type.outputs.release_type == 'alpha'
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            const payload = {
              "username": "BLU Alpha",
              "avatar_url": "https://raw.githubusercontent.com/DonnieDice/BLU/main/images/logo.png",
              "embeds": [{
                "title": "🔬 BLU Alpha - ${{ steps.extract_version.outputs.version }}",
                "description": "Development build for testing\\n\\n**What's New:**\\n${{ steps.extract_changelog.outputs.changelog }}",
                "color": 16711680,
                "footer": {
                  "text": "RGX Mods - Alpha Build",
                  "icon_url": "https://raw.githubusercontent.com/donniedice/SimpleQuestPlates/main/images/kiwi.gif"
                },
                "timestamp": "${{ steps.extract_version.outputs.timestamp }}"
              }]
            };
            
            const webhookUrl = new URL('${{ secrets.DISCORD_WEBHOOK }}');
            const options = {
              hostname: webhookUrl.hostname,
              path: webhookUrl.pathname + webhookUrl.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            };
            
            https.request(options, (res) => {
              console.log(`statusCode: ${res.statusCode}`);
            }).on('error', (error) => {
              console.error('Discord notification failed:', error);
            }).end(JSON.stringify(payload));

      - name: Send Discord Failure Notification
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const https = require('https');
            const payload = {
              "username": "BLU Build Failed",
              "avatar_url": "https://raw.githubusercontent.com/DonnieDice/BLU/main/images/logo.png",
              "embeds": [{
                "title": "❌ BLU Build Failed",
                "description": "The release workflow encountered an error",
                "url": "https://github.com/DonnieDice/BLU/actions/runs/${{ github.run_id }}",
                "color": 15158332,
                "fields": [
                  {
                    "name": "Version",
                    "value": "${{ steps.extract_version.outputs.version || 'Unknown' }}",
                    "inline": true
                  },
                  {
                    "name": "Workflow",
                    "value": "[View Logs](https://github.com/DonnieDice/BLU/actions/runs/${{ github.run_id }})",
                    "inline": true
                  }
                ],
                "footer": {
                  "text": "RGX Mods - Build System",
                  "icon_url": "https://raw.githubusercontent.com/donniedice/SimpleQuestPlates/main/images/kiwi.gif"
                },
                "timestamp": "${{ steps.extract_version.outputs.timestamp }}"
              }]
            };
            
            const webhookUrl = new URL('${{ secrets.DISCORD_WEBHOOK }}');
            const options = {
              hostname: webhookUrl.hostname,
              path: webhookUrl.pathname + webhookUrl.search,
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              }
            };
            
            https.request(options, (res) => {
              console.log(`statusCode: ${res.statusCode}`);
            }).on('error', (error) => {
              console.error('Discord notification failed:', error);
            }).end(JSON.stringify(payload));